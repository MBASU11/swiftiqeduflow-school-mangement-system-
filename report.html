<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <title>Student report card</title>
    <style>
      body { margin: 0; background: #eef1f5; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; color: #1b2430; }
      .bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; background: #1f3a5f; color: #fff; }
      .bar button { background: #fff; color: #1f3a5f; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
      main { padding: 16px; }
      .msg { max-width: 30rem; margin: 4rem auto; text-align: center; color: #5b6777; }
      @media print { .bar { display: none; } body { background: #fff; } main { padding: 0; } }
    </style>
  </head>
  <body>
    <div class="bar"><span>Student report card</span><button id="print-btn" hidden>Print / Save PDF</button></div>
    <main id="app"><p class="msg">Loading report card…</p></main>
    <script type="module" src="./js/reportViewer.js"></script>
  </body>
</html>
